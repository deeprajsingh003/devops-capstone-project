name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Steps for checking out the code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint nose
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: A step for linting the code after checkout
      run: |
        flake8 service
        pylint service

    - name: A step for executing unit tests using nosetests after the linting step
      run: |
        nosetests --with-spec --spec-color --with-coverage --cover-package=service
